name: CI
on:
  pull_request:
  push:
    branches: [main, feature/deployment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let publishing runs finish a matching backend/frontend pair.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ssh-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate SSH secrets and server readiness without deploying
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "Invalid SSH_HOST" >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "Invalid SSH_USER" >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || { echo "Invalid SSH_PORT" >&2; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo "Missing SSH secrets" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/vey-preflight-key"
          hosts="$RUNNER_TEMP/vey-preflight-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          askpass="$RUNNER_TEMP/vey-preflight-askpass"
          trap 'rm -f -- "$key" "$hosts" "$askpass"' EXIT
          if ! ssh-keygen -y -P '' -f "$key" >/dev/null 2>&1; then
            [[ -n "$SSH_KEY_PASSPHRASE" ]] || { echo "Encrypted or invalid key: SSH_KEY_PASSPHRASE is required" >&2; exit 1; }
            cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_KEY_PASSPHRASE"
          ASKPASS
            chmod 700 "$askpass"
            export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none
            # Remove encryption only from the ephemeral runner copy; never pass the secret in argv.
            ssh-keygen -p -N '' -f "$key" </dev/null >/dev/null
          fi
          ssh-keygen -y -P '' -f "$key" >/dev/null
          lookup="$SSH_HOST"
          if [[ "$SSH_PORT" != 22 ]]; then lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f "$hosts" >/dev/null || { echo "Known-hosts entry does not match SSH_HOST/SSH_PORT" >&2; exit 1; }
          ssh-keygen -l -f "$hosts" >/dev/null
          ssh -i "$key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for command in docker python3 flock; do command -v "$command" >/dev/null; done
          test -x /root/selfhost/vey/cd.sh
          previous=""
          for app in vey-backend vey-frontend; do
            directory="/root/selfhost/vey/$app"
            test -r "$directory/.env"
            docker compose --project-directory "$directory" -f "$directory/compose.yaml" config --quiet
            version=$(sed -n 's/^VERSION=//p' "$directory/.env")
            [[ "$version" =~ ^0\.[0-9]+$ ]]
            if [[ -n "$previous" && "$previous" != "$version" ]]; then
              echo "Backend/frontend versions differ" >&2; exit 1
            fi
            previous="$version"
          done
          for container in core_postgres18 core_kafka; do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == healthy ]]
          done
          docker exec core_nginx nginx -t
          for image in vey-api vey-frontend; do
            docker manifest inspect "ghcr.io/namdang-fdp/$image:feature-deployment" >/dev/null
          done
          echo "SSH authentication, host verification, compose files, infrastructure and registry access: OK"
          echo "Current application VERSION=$previous; no deployment performed"
          REMOTE
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Version and deploy regressions
        run: python3 -m unittest discover -s deployment/tests
      - name: Shell syntax and lint
        run: |
          bash -n deployment/cd.sh
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 deployment/cd.sh
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Compile and quality gates
        working-directory: api
        run: ./mvnw -B spotless:check checkstyle:check verify
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check formatting
        working-directory: frontend
        run: bun run format:check
      - name: Lint and typecheck
        working-directory: frontend
        run: bun run lint && bun run typecheck
      - name: Unit and component tests
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        env:
          # Next.js imports auth configuration during build; no live database is required.
          BETTER_AUTH_DATABASE_URL: postgresql://localhost:5432/vey_ci
          BETTER_AUTH_URL: http://localhost:3000
        run: BETTER_AUTH_SECRET="$(openssl rand -hex 32)" bun run build
  version:
    needs: [backend, frontend, deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deployment/version.py
  images:
    name: Container (${{ matrix.image }})
    needs: [backend, frontend, version]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: api
            image: vey-api
          - context: frontend
            image: vey-frontend
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/deployment') }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure registries
        id: registries
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          dockerhub_image=""
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::Set both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
              exit 1
            fi
            namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
            dockerhub_image="docker.io/${namespace,,}/${IMAGE_NAME}"
          fi
          {
            echo "dockerhub=$([[ -n "$dockerhub_image" ]] && echo true || echo false)"
            echo "images<<EOF"
            echo "$ghcr_image"
            if [[ -n "$dockerhub_image" ]]; then echo "$dockerhub_image"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && github.ref == 'refs/heads/main' }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://vey.dorriss.com' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [images, version]
    uses: ./.github/workflows/cd.yaml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
