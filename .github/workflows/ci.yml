name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Compile and quality gates
        working-directory: api
        run: ./mvnw -B spotless:check checkstyle:check verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        working-directory: frontend
        run: bun run lint && bun run typecheck
      - name: Unit and component tests
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        env:
          # Next.js imports auth configuration during build; no live database is required.
          BETTER_AUTH_DATABASE_URL: postgresql://localhost:5432/vey_ci
          BETTER_AUTH_URL: http://localhost:3000
        run: BETTER_AUTH_SECRET="$(openssl rand -hex 32)" bun run build
  api-image:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vey-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
