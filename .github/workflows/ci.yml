name: CI
on:
  pull_request:
  push:
    branches: [main, feature/deployment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let publishing runs finish a matching backend/frontend pair.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Version and deploy regressions
        run: python3 -m unittest discover -s deployment/tests
      - name: Shell syntax and lint
        run: |
          bash -n deployment/cd.sh
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 deployment/cd.sh
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Compile and quality gates
        working-directory: api
        run: ./mvnw -B spotless:check checkstyle:check verify
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check formatting
        working-directory: frontend
        run: bun run format:check
      - name: Lint and typecheck
        working-directory: frontend
        run: bun run lint && bun run typecheck
      - name: Unit and component tests
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        env:
          # Next.js imports auth configuration during build; no live database is required.
          BETTER_AUTH_DATABASE_URL: postgresql://localhost:5432/vey_ci
          BETTER_AUTH_URL: http://localhost:3000
        run: BETTER_AUTH_SECRET="$(openssl rand -hex 32)" bun run build
  version:
    needs: [backend, frontend, deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deployment/version.py
  images:
    name: Container (${{ matrix.image }})
    needs: [backend, frontend, version]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: api
            image: vey-api
          - context: frontend
            image: vey-frontend
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/deployment') }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure registries
        id: registries
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          dockerhub_image=""
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::Set both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
              exit 1
            fi
            namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
            dockerhub_image="docker.io/${namespace,,}/${IMAGE_NAME}"
          fi
          {
            echo "dockerhub=$([[ -n "$dockerhub_image" ]] && echo true || echo false)"
            echo "images<<EOF"
            echo "$ghcr_image"
            if [[ -n "$dockerhub_image" ]]; then echo "$dockerhub_image"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && github.ref == 'refs/heads/main' }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://vey.dorriss.com' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [images, version]
    uses: ./.github/workflows/cd.yaml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
