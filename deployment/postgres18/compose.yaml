name: vey-postgres18
services:
  postgres18:
    image: postgres:18.6
    container_name: core_postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: vey
    volumes:
      - ./data:/var/lib/postgresql
    networks:
      - selfhost_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d vey"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"
networks:
  selfhost_net:
    external: true
