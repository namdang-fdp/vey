name: vey-backend
services:
  backend:
    image: ghcr.io/namdang-fdp/vey-api:${VERSION:?required}
    container_name: vey-backend
    restart: unless-stopped
    env_file: .env
    networks:
      - selfhost_net
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8081/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
networks:
  selfhost_net:
    external: true
