# Include inside the existing http block. Docker DNS is inherited from nginx.conf.
server {
  listen 80;
  server_name vey.dorriss.com;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $upgrade_connection;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;

  location ~ ^/api/v1(?:/|$) {
    set $vey_api vey-backend:8081;
    proxy_pass http://$vey_api;
  }
  location / {
    set $vey_frontend vey-frontend:3000;
    proxy_pass http://$vey_frontend;
  }
}

server {
  listen 80;
  server_name vey-api.dorriss.com;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;

  location / {
    set $vey_api vey-backend:8081;
    proxy_pass http://$vey_api;
  }
}
