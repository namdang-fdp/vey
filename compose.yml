name: vey

services:
  postgres:
    image: postgres:18.6
    container_name: vey-postgres
    environment:
      POSTGRES_DB: vey_db
      POSTGRES_USER: vey
      POSTGRES_PASSWORD: ${VEY_POSTGRES_PASSWORD:-vey_local_password}
    ports:
      - "127.0.0.1:${VEY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vey -d vey_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.6
    container_name: vey-redis
    ports:
      - "127.0.0.1:${VEY_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: vey-kafka
    ports:
      - "127.0.0.1:${VEY_KAFKA_PORT:-59092}:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:${VEY_KAFKA_PORT:-59092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: vey-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: vey-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${VEY_KAFKA_UI_PORT:-58080}:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vey-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VEY_MINIO_ACCESS_KEY:-vey-local}
      MINIO_ROOT_PASSWORD: ${VEY_MINIO_SECRET_KEY:-vey-local-password}
    ports:
      - "127.0.0.1:${VEY_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${VEY_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v11.1.1
    container_name: vey-dozzle
    environment:
      DOZZLE_HOSTNAME: vey-local
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: label=com.docker.compose.project=vey
    ports:
      - "127.0.0.1:${VEY_DOZZLE_PORT:-58081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  dozzle_data:
